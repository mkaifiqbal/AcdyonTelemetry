<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Badge -->
  <rect width="64" height="64" rx="16" fill="#07090e" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Glowing Center Pulse Core -->
  <circle cx="32" cy="32" r="7" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Inner Radar Wave -->
  <circle cx="32" cy="32" r="14" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.85" stroke-dasharray="32 12"/>
  
  <!-- Outer Radar Wave -->
  <circle cx="32" cy="32" r="22" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="24 16"/>
  
  <!-- High-tech crosshairs -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="60" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="10" y2="32" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="60" y2="32" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
</svg>
